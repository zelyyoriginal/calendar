<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Календарь</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#f5f5f5;
            padding:20px;
        }

        .wrapper{
            max-width:420px;
            margin:auto;
        }

        .calendar{
            background:white;
            border-radius:16px;
            padding:20px;
            box-shadow:0 4px 10px rgba(0,0,0,.08);
        }

        .header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:20px;
        }

        .header button{
            border:none;
            background:#2AABEE;
            color:white;
            width:36px;
            height:36px;
            border-radius:50%;
            cursor:pointer;
            font-size:18px;
        }

        .header h2{
            font-size:22px;
        }

        .weekdays,
        .days{
            display:grid;
            grid-template-columns:repeat(7,1fr);
            gap:6px;
        }

        .weekdays div{
            text-align:center;
            font-weight:bold;
            color:#777;
            margin-bottom:8px;
        }

        .day{
            height:55px;
            border-radius:10px;
            background:#f0f0f0;
            display:flex;
            justify-content:center;
            align-items:center;
            cursor:pointer;
            position:relative;
            transition:.2s;
        }

        .day:hover{
            background:#dcefff;
        }

        .other{
            opacity:.35;
        }

        .today{
            background:#2AABEE;
            color:white;
        }

        .dot{
            width:7px;
            height:7px;
            background:red;
            border-radius:50%;
            position:absolute;
            bottom:6px;
            right:6px;
        }

        .selected{
            outline:3px solid orange;
        }

        .events{
            margin-top:20px;
            background:white;
            border-radius:16px;
            padding:18px;
            box-shadow:0 4px 10px rgba(0,0,0,.08);
        }

        .events h3{
            margin-bottom:15px;
        }

        .event{
            display:flex;
            gap:12px;
            padding:10px 0;
            border-bottom:1px solid #eee;
        }

        .event:last-child{
            border-bottom:none;
        }

        .event-date{
            width:65px;
            text-align:center;
            flex-shrink:0;
        }

        .event-day{
            font-size:24px;
            font-weight:bold;
        }

        .event-month{
            color:#777;
            font-size:13px;
        }

        .event-info{
            flex:1;
        }

        .event-time{
            color:#2AABEE;
            font-weight:bold;
            margin-bottom:4px;
        }

        .event-title{
            font-weight:bold;
        }

        .event-name{
            color:#666;
            font-size:14px;
        }
    </style>
</head>
<body>

<div class="wrapper">

    <div class="calendar">

        <div class="header">
            <button onclick="prevMonth()">◀</button>

            <h2 id="title"></h2>

            <button onclick="nextMonth()">▶</button>
        </div>

        <div class="weekdays">
            <div>Пн</div>
            <div>Вт</div>
            <div>Ср</div>
            <div>Чт</div>
            <div>Пт</div>
            <div>Сб</div>
            <div>Вс</div>
        </div>

        <div class="days" id="days"></div>

    </div>
    <div></div>
    <div class="events">

        <h3>📅 Ближайшие события</h3>

        <div id="eventList">

        </div>

    </div>


</div>


<script>

    const monthNames=[
        "Январь","Февраль","Март","Апрель",
        "Май","Июнь","Июль","Август",
        "Сентябрь","Октябрь","Ноябрь","Декабрь"
    ];

    let current=new Date();

    let eventDates=[
        "2026-08-05",
        "2026-08-07",
        "2026-08-18",
        "2026-08-28"
    ];

    draw();

    function draw(){

        const year=current.getFullYear();
        const month=current.getMonth();

        document.getElementById("title").innerText=
            monthNames[month]+" "+year;

        const days=document.getElementById("days");

        days.innerHTML="";

        let first=new Date(year,month,1);

        let start=first.getDay();

        if(start===0)
            start=7;

        let daysInMonth=
            new Date(year,month+1,0).getDate();

        let prevDays=
            new Date(year,month,0).getDate();

        for(let i=start-1;i>0;i--){

            let d=document.createElement("div");
            d.className="day other";
            d.innerText=prevDays-i+1;
            days.appendChild(d);

        }

        const today=new Date();

        for(let day=1;day<=daysInMonth;day++){

            let d=document.createElement("div");

            d.className="day";

            d.innerHTML=day;

            const date=
                year+"-"+
                String(month+1).padStart(2,"0")+"-"+
                String(day).padStart(2,"0");

            if(
                day===today.getDate() &&
                month===today.getMonth() &&
                year===today.getFullYear()
            ){
                d.classList.add("today");
            }

            if(eventDates.includes(date)){

                let dot=document.createElement("div");

                dot.className="dot";

                d.appendChild(dot);

            }

            d.onclick=function(){

                document
                    .querySelectorAll(".selected")
                    .forEach(e=>e.classList.remove("selected"));

                d.classList.add("selected");

                alert(date);

            };

            days.appendChild(d);

        }

        while(days.children.length%7!==0){

            let d=document.createElement("div");

            d.className="day other";

            d.innerText=
                days.children.length-
                (start-1)-
                daysInMonth+1;

            days.appendChild(d);

        }

    }

    function prevMonth(){

        current.setMonth(current.getMonth()-1);

        draw();

    }

    function nextMonth(){

        current.setMonth(current.getMonth()+1);

        draw();

    }


    const weekEvents = [

        {
            date:"2026-08-05",
            time:"19:00",
            title:"Java Meetup",
            name:"Discord"
        },

        {
            date:"2026-08-06",
            time:"21:00",
            title:"Обсуждение Spring",
            name:"Telegram"
        },

        {
            date:"2026-08-08",
            time:"15:30",
            title:"Созвон",
            name:"Команда"
        }

    ];

    drawEvents();

    function drawEvents(){

        const list=document.getElementById("eventList");

        list.innerHTML="";

        weekEvents.forEach(e=>{

            const d=new Date(e.date);

            list.innerHTML+=`
        <div class="event">

            <div class="event-date">
                <div class="event-day">${d.getDate()}</div>
                <div class="event-month">
                    ${monthNames[d.getMonth()].substring(0,3)}
                </div>
            </div>

            <div class="event-info">
                <div class="event-time">${e.time}</div>
                <div class="event-title">${e.title}</div>
                <div class="event-name">${e.name}</div>
            </div>

        </div>
        `;

        });

    }
</script>

</body>
</html>
